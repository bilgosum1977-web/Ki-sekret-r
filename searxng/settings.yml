use_default_settings: true

server:
  bind_address: "0.0.0.0"
  port: 8080
  base_url: "https://ki-sekret-r.onrender.com"
  secret_key: "ein_sicheres_passwort_hier"

# Das zwingt den Server, die IP-Header-Warnung komplett zu ignorieren:
http:
  x_forwarded_for: false
  x_real_ip: false

# Das schaltet die Bot-Erkennung vollständig im System ab:
limiter:
  enabled: false
