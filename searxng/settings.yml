use_default_settings: true

server:
  secret_key: "ein_sicheres_passwort_hier"
  limiter: false
  image_proxy: true
  base_url: "https://onrender.com"
  bind_address: "0.0.0.0:10000"

ui:
  static_use_hash: true
  default_locale: "de"
  default_theme: simple

search:
  safe_search: 0
  autocomplete: ""
  default_lang: "de-DE"

engines:
  - name: google
    engine: google
    shortcut: g

outgoing:
  request_timeout: 10.0
