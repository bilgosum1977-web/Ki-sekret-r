# SearXNG vollständige Standardkonfiguration
server:
  bind_address: "0.0.0.0"
  port: 8888
  base_url: "https://ki-sekret-r.onrender.com"
  secret_key: "change_me_to_something_random_and_secure"

brand:
  public_instance: false

search:
  safe_search: 0
  autocomplete: ""
  default_lang: "de"

doi_resolver:
  default: "oadoi.org"

engines:
  - name: google
    engine: google
    shortcut: go
  - name: duckduckgo
    engine: duckduckgo
    shortcut: dd
  - name: wikipedia
    engine: wikipedia
    shortcut: wp

ui:
  default_theme: simple
